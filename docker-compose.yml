# Local / generic Docker usage:  docker compose up -d --build
services:
  portarr:
    build: .
    image: ghcr.io/ali0cha/portarr:latest
    container_name: portarr
    restart: unless-stopped
    user: "568:568"   # the TrueNAS "apps" user; use your own (e.g. "1000:1000", "99:100" on Unraid) and give ./config to it
    ports:
      - "8765:8765"
    environment:
      TZ: Europe/Brussels
      # Optional HTTP basic auth (recommended if the port is reachable beyond your LAN)
      AUTH_USER: ""
      AUTH_PASSWORD: ""
    volumes:
      - ./config:/config   # must be writable by the user above (chown 568:568 ./config)
